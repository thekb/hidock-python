[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidock-usb"
version = "0.1.0"
description = "Local USB access to HiDock P1 recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.2,<2"]

[project.optional-dependencies]
# PyAV 19 removed metadata_errors, which faster-whisper 1.x still passes.
transcription = ["faster-whisper>=1.1,<2", "av>=11,<19"]

[project.scripts]
hidock = "hidock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
